name=sp800-208-xmss-esp32
version=0.1.0
author=The sp800-208-xmss-esp32 authors
maintainer=The sp800-208-xmss-esp32 authors
sentence=XMSS and XMSS^MT stateful hash-based post-quantum signatures (RFC 8391, NIST SP 800-208) for ESP32.
paragraph=The eXtended Merkle Signature Scheme with all SP 800-208 parameter sets (SHA-256, SHA-256/192, SHAKE256/256, SHAKE256/192; XMSS heights 10/16/20; XMSS^MT 20-60 with 2-12 layers). Stateful private keys with write-ahead state updates in NVS (an index is stored before its signature exists), SP 800-208 multi-tree key generation with per-tree seeds, tree caches for fast signing, ESP32 hardware RNG and optional SHA hardware acceleration. Verified against the XMSS reference implementation.
category=Communication
